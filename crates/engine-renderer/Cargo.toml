[package]
name = "engine-renderer"
version.workspace = true
edition.workspace = true
description = "PostRust — Vulkan presentation backend (ash)"
license.workspace = true

[dependencies]
# Vulkan binding (T-03 investigation concluded: ash 0.38, the de-facto
# standard raw Vulkan binding, actively maintained, pairs with sdl3-sys's
# ash integration). Direct Vulkan remains the single backend (T-02).
ash = "0.38.0"
# Surface creation and instance-extension discovery stay on the SDL
# boundary the wrapper already provides; the wrapper's `ash` feature makes
# its VkInstance/VkSurfaceKHR types alias ash's handles directly.
sdl3 = { version = "0.20", default-features = false, features = ["build-from-source-static", "ash"] }
# Validation-layer messages, swapchain events, and renderer diagnostics
# flow through the shared engine-core logger (L0, TECH-ARCHITECTURE §2.12).
engine-core = { path = "../engine-core" }
# Debug-overlay font: public-domain 8x8 bitmap data, no code (Stage 2
# authorization item 4 — minimal overlay, no UI framework).
font8x8 = "0.3.1"
# Zero-copy vertex/matrix byte casts (Pod casts of #[repr(C)] scene and
# overlay vertices and the push-constant matrix).
bytemuck = { version = "1", features = ["derive"] }
# Lazy static initialization for immutable cached data (rest pose block).
once_cell = "1.19"

[build-dependencies]
# Minimal GLSL-to-SPIR-V path (T-05): pure-Rust compilation at build time —
# no external shader tools on any platform (dev pod, CI runners, the lead's
# rig). The permanent shader-toolchain decision remains deferred.
# Pinned to 29.0.4: naga 30.0.1's glsl-in frontend does not compile against its
# own ir module (apply_default_interpolation missing) — observed 2026-10-19.
# wgsl-in added for the Cycle 6-A atlas shaders (the probed finding: glsl-in
# cannot express sampled textures on this version).
naga = { version = "=29.0.4", features = ["glsl-in", "spv-out", "wgsl-in"] }

[dev-dependencies]
# Test-side re-parse of the build-emitted SPIR-V (the orientation
# corrective's A4 pin): the SAME pinned naga, with the spv-in frontend.
naga = { version = "=29.0.4", features = ["spv-in"] }

[target.'cfg(unix)'.dependencies]
# The same console-build enabler engine-shell carries (Stage 1's
# Unix-without-desktop-libs workaround): headless environments without
# X11/Wayland development libraries (the CI runners) otherwise fail
# SDL's CMake configure. In a WORKSPACE build engine-shell's copy
# unifies this feature in anyway; the isolated release battery (the
# batch-3 review's CI step) builds this crate alone, so the enabler
# must be carried here too. Inert on Windows.
sdl3-sys = { version = "0.7.2", default-features = false, features = ["sdl-unix-console-build"] }
