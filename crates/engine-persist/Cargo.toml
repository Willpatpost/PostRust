[package]
name = "engine-persist"
version.workspace = true
edition.workspace = true
description = "PostRust — content-addressed revision store, canonical mediums, journal, commit pipeline, and recovery"
license.workspace = true

[dependencies]
engine-core = { path = "../engine-core" }
# D-EE-10 item 4 (the owner APPROVED 2026-11-27): the SQLite
# provider is an OPTIONAL dependency behind the `sqlite` Cargo
# feature — ENABLED BY DEFAULT (ordinary consumers retain the full
# functionality: the SqliteMedium provider, the §6.1 migration, the
# backup capture). A --no-default-features build is LOCAL-ONLY:
# rusqlite (and the bundled SQLite C compile, the F-02 measured
# cost) never resolves, and every operation that REQUIRES the
# provider fails visibly with the typed MediumError::SqliteNotBuilt
# refusal — NEVER a silent local downgrade.
rusqlite = { version = "0.40.2", features = ["bundled", "limits", "backup"], optional = true }
sha2 = "0.11"

[features]
default = ["sqlite"]
# The SQLite canonical-medium provider (D-EE-10 item 4): the whole
# `sqlite` module (`SqliteMedium`, `SqliteMediumConfig`, the fault
# seam), the `migrate` module (`migrate_local_to_sqlite` and its
# types), the `MediumError::Sqlite` / `MigrationPending` variants,
# and every sqlite-touching test battery. DEFAULT ON; a
# --no-default-features build is local-only (the absent-type
# surface is documented in the lib header).
sqlite = ["dep:rusqlite"]
# The K2-C1 compile-time activation barrier (the R8 corrective):
# composite publication's test-only facility exists ONLY when this
# feature is explicitly enabled — a normal production build (no
# --features flag) has NO activation function at all (the code does
# not compile into the binary). The CI test command and the
# engine-slice dev-dependencies enable it for the test harness.
#
# NEVER enable this feature in a shipping build (the R16
# documentation obligation): it exists solely so the test harness
# can drive the composite publication path against the activation
# barrier's refusal semantics. The CI carries an explicit build
# check (the Linux-only activation-isolation step) proving the
# feature-disabled artifact carries zero activation symbols.
composite-test-fixture = []
# Test-only (the RMD-03 isolation corrective, the T2-B pattern):
# the local medium's reclamation process-exit crash seams
# (ARM_RECLAIM_MID_UNIT / ARM_RECLAIM_LAST_UNIT) — compile-time
# EXCLUDED from every default build; enabled only through
# engine-slice's forwarding feature (the heavy shard's battery,
# whose pp_b3_reclaim children are the sole armers).
crash-test-seams = []

[[test]]
name = "composite_append"
required-features = ["composite-test-fixture", "sqlite"]

[[test]]
name = "composite_reader"
required-features = ["composite-test-fixture"]

[lints]
workspace = true
