[package]
name = "engine-slice"
version.workspace = true
edition.workspace = true
description = "PostRust — integration and demonstration driver (the demo/test battery)"
license.workspace = true
build = "build.rs"

[features]
# D-EE-10 item 4 (the owner APPROVED 2026-11-27): the SQLite
# provider is threaded through engine-slice's own `sqlite` feature
# — ENABLED BY DEFAULT, so the ordinary build retains the full
# functionality (the Database store location, the backup capture,
# the SQLite benchmark routes). A --no-default-features build is
# LOCAL-ONLY: the engine-persist dependency resolves without
# rusqlite, the `backup` module and the store union's SQLite arm
# are compile-time absent, and every operation that REQUIRES the
# provider (a StoreLocation::Database selection — the persist demo,
# the recovery, the worker spawn) fails visibly with the typed
# MediumError::SqliteNotBuilt refusal naming the missing feature —
# NEVER a silent local downgrade.
default = ["sqlite"]
sqlite = ["engine-persist/sqlite"]
# Test-only (the T2-B isolation corrective, extended by the RMD-03
# corrective to forward into engine-persist): the crossing's
# process-death crash-test seams — compile-time EXCLUDED from every
# default build (the production artifact carries neither the arms
# nor the process-exit behavior); enabled only by the test
# invocations that drive the genuine child-process deaths. The
# forwarding also enables engine-persist's own crash-test-seams
# feature (the local medium's two reclamation seams — the same
# compile-time isolation, the same sole-arming test corpus).
crash-test-seams = ["engine-persist/crash-test-seams"]

[dependencies]
engine-core = { path = "../engine-core" }
# default-features = false + the `sqlite` forwarding feature above
# (D-EE-10 item 4): the default build resolves exactly today's
# feature set (engine-persist's `sqlite`), while a
# --no-default-features engine-slice build is genuinely local-only
# (engine-persist compiles without rusqlite — the F-02 footprint
# saving is real at the integration tier, not just the library
# tier).
engine-persist = { path = "../engine-persist", default-features = false }
engine-renderer = { path = "../engine-renderer" }
engine-shell = { path = "../engine-shell" }

[dev-dependencies]
# Test-only: direct row access for the S6-C4 worker-backed SQLite
# classification regressions (the same SQLite library the workspace
# already builds — never linked into the binary).
rusqlite = { version = "0.40.2", features = ["bundled"] }
# The K2-C1 composite-publication test facility (the R8 corrective):
# the feature exists ONLY in engine-slice's test builds — the
# production binary never sees it (dev-dependencies do not apply to
# cargo build / cargo build --release).
engine-persist = { path = "../engine-persist", features = ["composite-test-fixture"] }

[lints]
workspace = true
