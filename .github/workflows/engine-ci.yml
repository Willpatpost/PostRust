      # warmed-allocation constancy). The binary's two SDL tests
      # serialize on its sdl_lock (the engine-shell test pattern);
      # this step's command is unchanged.
      # (Cycle 6-E2) The indirect-submission proof: the same shipped
      # table through ONE vkCmdDrawIndirect per kind with GPU-side
      # counts — byte-equal to BOTH the direct instanced and the
      # per-object frames, the one-time command-buffer allocation
      # pinned (+1 device_memory), an oracle wall through the
      # indirect submission, and the replacement lifecycle. Three
      # SDL tests now serialize on the same sdl_lock; the command
      # stays unchanged.
      # (Era 1 corrective, findings 11+18) The oblique wheel
      # fixture joins the same binary.
      # (Era 2 stage 5) TWO more gates join the same binary, both
      # serialized on the same sdl_lock: the skinning oracle (one
      # walking npc's torso face per-pixel against skin_vertex +
      # the instance transform, the dead-on camera derived from the
      # SKINNED rectangle, the rest-pose differential) and the
      # animated N-vs-1 (the fixture population walking at frame 33,
      # per-object vs instanced byte-equal, the motion
      # differential); the full-table gate's animated regime (the
      # allocation counters constant across warmed WALKING frames,
      # the per-frame pose digests) extends the EXISTING population
      # gate. The command stays unchanged (the binary runs all its
      # gates).
      - name: Instanced-proxy equivalence gate (lavapipe)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SDL_VIDEODRIVER=offscreen cargo test -p engine-slice --test render_instanced -- --ignored --nocapture
      # (Cycle 6-F, the shadow gates) The shadow map's known-answer
      # (every texel vs the deterministic core's CPU raycaster — the
      # depth-only pass's map at float-epsilon) and the pixel
      # equivalence (a fully-shadowed ground patch renders exactly
      # albedo·ambient, a fully-lit patch the unshadowed equation,
      # the shadow visibly changes the frame, and the unshadowed
      # path stays pixel-identical). The per-stage println! evidence
      # (the texel census, the max depth error, the patch errors, the
      # allocation pins) is what the CI log must show.
      # (Era 1 package 2, soft shadows) The same binary's SECOND
      # #[ignore]d gate now runs here too: the PCF penumbra
      # pixel-equivalence — the shader's filtered factor vs the CPU
      # filter (pcf_at_point) over the SAME captured map bytes, per
      # pixel on a patch straddling the day shadow edge, the
      # documented exposure-class tolerances, the regime census
      # (deep shadow / penumbra / full light), and the warmed-
      # allocation constancy. The command is unchanged (the binary
      # runs both tests).
      # (Era 2 stage 5) The populated shadow-map gate joins the same
      # binary: the corner population CASTING through the shadowed
      # depth pass, the captured map vs the populated raycaster
      # (map_texel_depth_populated over the SAME evaluated blocks)
      # at REST and at frame-33 WALK, the per-class census with the
      # 2.68e-7 tolerance's first device-measured evidence printed,
      # the rest-vs-walked differential, and the warmed constancy.
      # The command is unchanged (the binary runs all its gates).
      - name: Directional-shadow gates (lavapipe)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SDL_VIDEODRIVER=offscreen cargo test -p engine-slice --test render_shadows -- --ignored --nocapture
      # (Era 1 package 3, the sky gates) The sky's known-answer
      # pixels (the gradient extremes and the disc center vs the CPU
      # sky_color, per-pixel rays), the composition proof (a
      # fully-covered frame byte-identical with the sky on and off;
      # the background replaced on a sky-visible pose), the one-time
      # sky-state allocation delta, and the warmed constancy. The
      # per-stage println! evidence is what the CI log must show.
      - name: Sky gates (lavapipe)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SDL_VIDEODRIVER=offscreen cargo test -p engine-slice --test render_sky -- --ignored --nocapture
      # (Era 1 package 6, the post gates) The HDR chain's
      # known-answer pixels vs post.rs's full-chain reference
