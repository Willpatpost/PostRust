          echo "$a" | grep -q "executed 45717" || { echo "Stage 3 baseline execution count changed"; exit 1; }
          echo "$a" | grep -q "engine-lanes=5591d3eb05643e78" || { echo "Stage 3 lane fingerprint changed"; exit 1; }
          echo "$a" | grep -q "state-lanes=9d90cb3bbd45b032" || { echo "Stage 3 state-lanes fingerprint changed"; exit 1; }
      - name: Stage 4 presence scenario determinism (double run per scenario)
        shell: bash
        run: |
          for scenario in stationary walk tour; do
            a=$(cargo run -q -p engine-slice -- --sim --presence $scenario)
            b=$(cargo run -q -p engine-slice -- --sim --presence $scenario)
            if [ "$a" != "$b" ]; then
              echo "presence scenario $scenario diverged between runs"
              exit 1
            fi
            echo "$scenario: $(echo "$a" | grep -o 'stage4=[0-9a-f]*')"
          done
      - name: Vulkan offscreen render smoke (Linux only — software rasterizer, correctness evidence, NOT performance evidence)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-validationlayers
          # F-09: every finite-frame smoke uses `--fps uncapped` — the
          # numeric `--fps 0` these commands carried was silently clamped
          # to 1 FPS (pacing each 20-frame smoke at ~20 s); numeric 0 is
          # now refused by the binary, so the uncapped spelling is also
          # the only valid no-pacing form.
          SDL_VIDEODRIVER=offscreen cargo run -p engine-slice -- --render --frames 20 --fps uncapped
          # Corrective-pass verification: run with the Khronos validation
          # layer actually enabled and exercise the swapchain-recreation
          # path (--simulate-resize) — the demo exits nonzero when the
          # layer is active and reports errors.
          SDL_VIDEODRIVER=offscreen cargo run -p engine-slice -- --render --frames 20 --fps uncapped --validation on --simulate-resize
          # Stage 4: the regional render path (camera-as-presence, dynamic
          # region-scene buffers) under the ACTIVE validation layer, plus
          # the swapchain-recreation path with region geometry live — zero
          # application-generated validation errors required. Windows
          # runners expose no Vulkan loader; that platform's validation
          # coverage stays in these Linux gates (reported honestly, not
          # silently skipped).
          SDL_VIDEODRIVER=offscreen cargo run -p engine-slice -- --render --regions --frames 20 --fps uncapped --validation on
          SDL_VIDEODRIVER=offscreen cargo run -p engine-slice -- --render --regions --frames 20 --fps uncapped --validation on --simulate-resize
          # Stage 4 final-review finding A: force pipeline replacement on
          # recreation with region buffers initialized — the
          # surface-format-change lifecycle (region-scene buffer
          # carry-over) that same-format resizing cannot reach.
          SDL_VIDEODRIVER=offscreen cargo run -p engine-slice -- --render --regions --frames 20 --fps uncapped --validation on --simulate-resize --replace-pipelines
      # (Cycle-1 corrective R1, the ChatGPT review 2026-11-15) The
      # F-03 Step 1 oversize regression is #[ignore]d in the ordinary
      # battery (pod-only lavapipe) — this ENFORCED step executes it
      # on this Linux runner with the drivers installed above. The
      # log must show the test RUNNING (1 passed, not an ignored
      # skip) and its printed evidence: the region and overlay oversize
      # paths, the exact counter values (1000/frame, 2000 cumulative,
      # 36000 overlay), the double-count and cross-contamination
      # guards, and clean validation. Compilation or an ignored-test
      # result is NOT execution evidence (the review's bar).
      - name: Vulkan oversize overflow regression (Linux only — the enforced F-03 Step 1 execution)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SDL_VIDEODRIVER=offscreen cargo test -p engine-slice --test render_overflow -- --ignored --nocapture
      # (The 2026-11-17 orientation corrective) The ENFORCED visual-
      # orientation regression: the real renderer with pixel readback
      # under the offscreen software ICD — ground colors in the LOWER
      # frame region, an above-camera marker in the UPPER region, a
      # face-on TOP surface (the winding/culling proof), and the
      # overlay glyphs in the top-left corner. The per-stage println!
      # evidence is what the CI log must show (the render_overflow
      # discipline: actual pixel-measured execution, never a compile
      # or an ignored skip).
      - name: Visual-orientation pixel regression (Linux only — the enforced orientation corrective execution)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SDL_VIDEODRIVER=offscreen cargo test -p engine-slice --test render_orientation -- --ignored --nocapture
      - name: Atlas RGBA equivalence and allocation regression (Linux Vulkan)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SDL_VIDEODRIVER=offscreen cargo test -p engine-slice --test render_glyph_atlas -- --ignored --nocapture
      - name: Corner lighting oracle and warmed allocations (lavapipe)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SDL_VIDEODRIVER=offscreen cargo test -p engine-slice --test render_corner -- --ignored --nocapture
      # (Cycle 6-E, the merge-blocking equivalence gate) The N-vs-1
      # instanced-draw proof: the SAME population as N single-instance
      # draws vs ONE instanced draw per kind must produce byte-equal
      # captured frames, with the draw-call counts pinned (13 vs 2),
