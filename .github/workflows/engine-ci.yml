      # the pod's lavapipe).
      - name: Reflection gates (lavapipe)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SDL_VIDEODRIVER=offscreen cargo test -p engine-slice --test render_reflection -- --ignored --nocapture
      - name: Full day and night route measurements (lavapipe)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          export SDL_VIDEODRIVER=offscreen
          for preset in day night; do
            args=()
            if [ "$preset" = night ]; then args+=(--night); fi
            cargo run -q -p engine-slice -- --corner "${args[@]}" --fps uncapped --validation on | tee corner.log
            for regime in live exact; do
              for series in 'CPU frame work' 'frame interval' 'GPU render pass'; do
                grep -Eq "^$regime $series .*n=601" corner.log
              done
            done
            grep -Eq 'peak process resident memory: [1-9][0-9]* KiB' corner.log
          done
          # (Cycle 6-E) The populated route through the instanced
          # path: the same 601-frame measurement regime with the
          # deterministic proxy population live — the draw-call
          # headline and the populated-route stability evidence
          # (lavapipe is a software rasterizer: correctness and
          # steady-state evidence, NOT performance evidence — the
          # rig measurement commands live in the package's PR).
          # (Cycle 6-E2) The populated route's DEFAULT submission is
          # now the indirect path (one vkCmdDrawIndirect per kind,
          # GPU-side counts — the mechanism exercised at route
          # scale); --proxy-instanced selects the direct 6-E
          # submission and --proxy-reference the per-object shape
          # for the rig's before/after runs.
          cargo run -q -p engine-slice -- --corner --populated --fps uncapped --validation on | tee corner-populated.log
          for regime in live exact; do
            for series in 'CPU frame work' 'frame interval' 'GPU render pass'; do
              grep -Eq "^$regime $series .*n=601" corner-populated.log
            done
          done
          grep -Eq 'proxy population: [1-9][0-9]* instances \([0-9]+ npc \+ [0-9]+ vehicle\), 2 draw calls per frame \(indirect mode\)' corner-populated.log
          grep -Eq 'validation warnings/errors 0/0' corner-populated.log
          # (Cycle 6-F) The shadowed route: the same 601-frame
          # measurement regime through the depth-only pass + the
          # shadowed lit pipeline — steady-state evidence for the
          # shadow path (lavapipe is a software rasterizer:
          # correctness evidence, NOT performance evidence).
          cargo run -q -p engine-slice -- --corner --shadows --fps uncapped --validation on | tee corner-shadows.log
          for regime in live exact; do
            for series in 'CPU frame work' 'frame interval' 'GPU render pass'; do
              grep -Eq "^$regime $series .*n=601" corner-shadows.log
            done
          done
          grep -Eq 'directional shadows: one cascade \(1024 texels\)' corner-shadows.log
          grep -Eq 'validation warnings/errors 0/0' corner-shadows.log
          # (Era 1 package 4: day/night) The cycling route: the same
          # 601-frame measurement regime with the atmosphere advancing
          # with the demo clock (--day-night 20 — the route's ~11 s
          # wall at uncapped speed spans past the half-period night
          # endpoint: day → night → dawn within one run). The series
          # still print (the same submission work per frame); the
          # cycle's banner and clean validation are the additions.
          cargo run -q -p engine-slice -- --corner --day-night 20 --fps uncapped --validation on | tee corner-daynight.log
          for regime in live exact; do
            for series in 'CPU frame work' 'frame interval' 'GPU render pass'; do
              grep -Eq "^$regime $series .*n=601" corner-daynight.log
            done
          done
          grep -Eq 'day/night cycle: 20s period' corner-daynight.log
          grep -Eq 'validation warnings/errors 0/0' corner-daynight.log
          # (Era 1 package 6: post) The post route: the same
          # 601-frame measurement regime through the HDR
          # render-target chain (the scene pass into the
          # RGBA16F target, the bloom mips, the ACES composite).
          # The series still print (the chain is presentation
          # work on the same submission); the post banner and
          # clean validation are the additions.
          cargo run -q -p engine-slice -- --corner --sky --post --fps uncapped --validation on | tee corner-post.log
          for regime in live exact; do
            for series in 'CPU frame work' 'frame interval' 'GPU render pass'; do
              grep -Eq "^$regime $series .*n=601" corner-post.log
            done
          done
          grep -Eq 'post: the HDR chain' corner-post.log
          grep -Eq 'validation warnings/errors 0/0' corner-post.log
          # (Era 1 package 7: wet reflection) The wet route: the same
          # 601-frame measurement regime with the planar reflection
          # live (the mirrored buildings + the Schlick-blended
          # ground re-draw).
          cargo run -q -p engine-slice -- --corner --wet --fps uncapped --validation on | tee corner-wet.log
          for regime in live exact; do
            for series in 'CPU frame work' 'frame interval' 'GPU render pass'; do
              grep -Eq "^$regime $series .*n=601" corner-wet.log
            done
          done
          grep -Eq 'wet ground: the planar reflection' corner-wet.log
          grep -Eq 'validation warnings/errors 0/0' corner-wet.log
          # (Era 1 package 1: free-look) The interactive camera's
          # offscreen smoke: the REAL free-look loop end to end —
          # construction on the route's entry waypoint (the first
          # frame is matrix-identical to the route's first — the
          # shared orientation conversion is lib-tested), presentation
          # through the same submission selection, the bounded
          # --frames auto-quit — under the ACTIVE validation layer
