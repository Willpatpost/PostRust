      - name: Weather gates (lavapipe)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SDL_VIDEODRIVER=offscreen cargo test -p engine-slice --test render_weather -- --ignored --nocapture
      # (Era 1 package 7, the wet-ground reflection gates) The
      # mirror chain's known-answer pixels vs planar.rs through the
      # real render path (MEASURED 1/255 on the dev pod's lavapipe —
      # the reflected ray raycast into the boxes, the lit equation
      # at the hit, the Schlick blend over the dry pixel), the
      # overhead matte anchor, the dry byte-identity, the
      # allocation delta, and the composition smokes. The
      # per-stage println! evidence is what the CI log must show.
      # (Era-1 corrective recursive phase, post-edge-coverage,
      # finding 4's wet half) The wet-band gate now runs ALL THREE
      # depth-format cells — D32 negotiated, forced D24_S8, and
      # forced D16 (the review's "force each supported fallback";
      # D16's coarser 16-bit quantization makes the EQUAL-comparison
