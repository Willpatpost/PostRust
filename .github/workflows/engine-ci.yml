      # cycle-2 main 2ea7622, plus Agent A's C5d discovered-range-
      # observation AND Agent B's B-R1a4 witness-degradation matrix,
      # both from that baseline; recomputed from executed runs —
      # never estimates): this shard executes 955 tests on Linux /
      # 904 on Windows (the cycle-3 consolidated 947 / 896 plus the
      # F-01 audit-hardening package's 3 FULLY CROSS-PLATFORM
      # engine-persist lib tests — the malformed-epoch regression +
      # the two try_regular tests, no cfg gates — plus the
      # POST-AUDIT REMEDIATION F-14 package's 5 FULLY CROSS-PLATFORM
      # engine-persist lib tests, the maximum-epoch construction-
      # boundary regressions: four plain (the v1 ledger publication,
      # the witness object publication, the MK publication, the
      # commit pipeline) and one feature-gated (the plan
      # publication); the Linux count MEASURED at this exact shard
      # command on the remediation worktree: 955 passed / 1 ignored
      # / 30 result lines, rc=0; the Windows count the exact uniform
      # delta 899 + 5); heavy supplies 455 /
      # 454 (the cycle-3 448 / 447 plus the F-07 package's six
