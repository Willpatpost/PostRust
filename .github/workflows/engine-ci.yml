      # (1×256 and 2×256 through the actual safe_load OOB guards,
      # max 3-4/255 at each cell's single mid-ramp row; the
      # negative/zero/midtone/over-one HDR through the real
      # composite, the negative channels EXACT black — MEASURED on
      # the pod's lavapipe).
      # (The shadowed-HDR populated variant, 2026-11-25 — Era-2
      # package 1's documented follow-up landed) The same step now
      # also executes the three-way composition gate
      # shadowed_populated_composes_through_the_hdr_chain:
      # --populated --shadows --post together drew NO proxies before
      # (the HDR arm's belt-check skipped them; the demo route
      # refused with 'populated route drew no proxy calls' —
      # MEASURED on this pod). The gate pins: the full 24+2 table
      # through the composition (2 draws), the presence ink (34166
      # bytes vs the unpopulated frame), the one-time populated
      # families' delta (6, 4, 16, 0) then constant with the warmed
      # frame byte-identical, and the decisive full-chain known
      # answers — a light-facing torso wall DEEP in a building's
