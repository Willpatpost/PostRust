      - name: Post gates (lavapipe)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SDL_VIDEODRIVER=offscreen cargo test -p engine-slice --test render_post -- --ignored --nocapture
      # (Era 2 package C stage 5, the weather gates) THE RAIN
      # ACCEPTANCE on lavapipe: the ink-count visual gate (the
      # rain visible in the corner capture — MEASURED 492
      # differing bytes on the dev pod's lavapipe, the floor 200
      # holding a wide margin), the warmed raining allocation
      # constancy (BOTH counters — renderer.allocations() constant
      # AND the host counter zero on the measured calls), the
      # double-run byte-equality, the rain-kind N-vs-1 submission
