      # what the CI log must show.
      # (Era-1 corrective recursive phase, findings 3+8) The same
      # step now also executes the fault-injection gate: every
      # target-builder stage fault unwinds to the pre-attempt
      # census, no slot strands, recoveries land (MEASURED on the
      # pod's lavapipe — the full 21-cell matrix, 4.65 s).
      # (Era-1 corrective recursive phase, post-edge-coverage,
      # findings 16+17) The same step now also executes the two
      # check-half gates: the asymmetric off-center disc at the odd
      # rectangular 121×75 extent under the frame's TRUE aspect
      # (disc patch 0/255, corners 1/255, the bloom ring's measured
      # lift ≥2/255 at the oracle-chosen distance — the
      # horizontal-mirror discriminator the centered square fixture
